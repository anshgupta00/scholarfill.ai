<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>scholarfill.ai Helper</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --primary-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-success: #34d399;
      --text-error: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 16px;
      overflow-x: hidden;
      border-radius: 12px;
    }

    /* Header styling */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      background: var(--primary-gradient);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Connection Status */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-muted);
    }

    .status-dot.connected {
      background-color: var(--text-success);
      box-shadow: 0 0 8px var(--text-success);
      animation: pulse 2s infinite;
    }

    .status-dot.disconnected {
      background-color: var(--text-error);
      box-shadow: 0 0 8px var(--text-error);
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.5; }
    }

    /* Glassmorphic container cards */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-info-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .form-info-url {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Action buttons */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Notifications & States */
    .info-text {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    .text-link {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    .error-banner {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.2);
      color: var(--text-error);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
      word-break: break-word;
    }

    .success-banner {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.2);
      color: var(--text-success);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
      text-align: center;
    }

    /* Spinner */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-logo">S</div>
      <span class="brand-title">scholarfill.ai</span>
    </div>
    <div class="status-badge">
      <div id="statusDot" class="status-dot disconnected"></div>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <!-- Error Alerts -->
  <div id="errorBanner" class="error-banner"></div>
  <div id="successBanner" class="success-banner"></div>

  <!-- Card: active page detect -->
  <div class="card" id="formCard">
    <div class="card-title">Current Tab</div>
    <div id="noFormDetected" class="info-text">
      Navigate to a Google Form page to begin scraping.
    </div>
    <div id="formDetected" style="display: none;">
      <div class="form-info-title" id="formTitle">Form Title</div>
      <div class="form-info-url" id="formUrl">Form URL</div>
    </div>
  </div>

  <!-- Card: Control Panel -->
  <div class="card">
    <div class="card-title">scholarfill.ai Actions</div>
    <div class="button-group">
      <!-- Action 1: Scrape -->
      <button class="btn btn-primary" id="btnScrape" disabled>
        <span class="spinner" id="scrapeSpinner"></span>
        <span id="scrapeBtnText">Scrape Page & Map AI</span>
      </button>
      
      <!-- Action 2: Fill -->
      <button class="btn btn-secondary" id="btnFill" disabled>
        <span class="spinner" id="fillSpinner"></span>
        <span id="fillBtnText">Auto-Fill Tab Fields</span>
      </button>
    </div>
  </div>

  <!-- Footer Info / Link to dashboard -->
  <div class="info-text" style="margin-top: 16px;">
    Open the <span class="text-link" id="linkDashboard">scholarfill.ai Dashboard</span>
  </div>

  <!-- Load JavaScript -->
  <script src="popup.js"></script>
</body>
</html>
